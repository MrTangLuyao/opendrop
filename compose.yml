# opendrop. install.sh puts this file next to an .env file in /opt/opendrop.
# Plain HTTP:  docker compose up -d
# HTTPS:       set DOMAIN and COMPOSE_PROFILES=https in .env, write a Caddyfile, then up -d
name: opendrop

x-logging: &logging
  driver: local
  options:
    max-size: 1m
    max-file: "2"

services:
  opendrop:
    image: ${OPENDROP_IMAGE:-ghcr.io/mrtangluyao/opendrop:latest}
    container_name: opendrop
    restart: unless-stopped
    ports:
      # OPENDROP_BIND empty: every IPv4 and IPv6 address of the host
      - "${OPENDROP_BIND:+${OPENDROP_BIND-}:}${OPENDROP_PORT:-80}:8080"
    environment:
      # IPv4 and IPv6; 0.0.0.0:8080 on a kernel without IPv6
      OPENDROP_ADDR: "${OPENDROP_ADDR:-[::]:8080}"
      OPENDROP_TRUST_PROXY: ${OPENDROP_TRUST_PROXY:-false}
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    stop_grace_period: 30s
    logging: *logging

  # On the host network Caddy sees the real IPv4 and IPv6 client addresses;
  # it forwards to opendrop on 127.0.0.1:OPENDROP_PORT.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:-}
      OPENDROP_PORT: ${OPENDROP_PORT:-8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - opendrop
    logging: *logging

networks:
  default:
    # With IPv6 here Docker forwards IPv6 visitors with their own address.
    # install.sh sets it to true when Docker can create IPv6 networks.
    enable_ipv6: ${OPENDROP_IPV6:-false}
