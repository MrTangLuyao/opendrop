<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>opendrop</title>
  <meta name="theme-color" content="#1f1f1e">
  <link rel="icon" href="lib/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="antialiased">

  <nav id="navbar">
    <a id="brand" class="ripple-surface" href="/" aria-label="open.drop home">
      <svg class="brand-icon" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="nav-logo-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3a3a39"/><stop offset="100%" stop-color="#1f1f1e"/></linearGradient>
          <linearGradient id="nav-logo-accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97757"/><stop offset="100%" stop-color="#ffb49d"/></linearGradient>
        </defs>
        <rect x="2" y="2" width="92" height="92" rx="20" fill="url(#nav-logo-bg)" stroke="#4a4a49" stroke-width="1"/>
        <path d="M28 58 Q22 58 22 50 Q22 42 30 42 Q32 30 46 30 Q60 30 62 42 Q72 42 72 50 Q72 58 66 58 Z" fill="url(#nav-logo-accent)"/>
        <path d="M47 50 L47 68 M40 62 L47 69 L54 62" stroke="#4a4a49" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="brand-text">
        <span class="b-static">open</span><span class="b-dot">.</span><span class="b-page">drop</span>
      </span>
      <span class="admin-badge">admin</span>
    </a>
    <div class="nav-right">
      <a href="/" class="nav-link-btn ripple-surface" id="back-to-app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        <span data-i18n="nav-back-to-app">返回站点</span>
      </a>
      <button id="admin-lang-toggle" class="icon-btn ripple-surface" type="button" aria-label="Toggle language" title="EN ⇄ 文">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
        <span class="visually-hidden">EN ⇄ 文</span>
      </button>
      <a id="admin-github-link" class="icon-btn ripple-surface" href="https://github.com/MrTangLuyao/opendrop" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1-.02-1.97-3.2.69-3.87-1.54-3.87-1.54-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.69 1.24 3.34.95.1-.74.4-1.24.72-1.53-2.55-.29-5.23-1.27-5.23-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.17.92-.25 1.91-.38 2.89-.38.98 0 1.97.13 2.89.38 2.2-1.48 3.16-1.17 3.16-1.17.62 1.58.23 2.75.11 3.04.74.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.36-5.25 5.65.41.35.78 1.04.78 2.1 0 1.52-.01 2.74-.01 3.11 0 .31.21.67.8.55C20.71 21.39 24 17.08 24 12 24 5.65 18.85.5 12 .5z"/></svg>
      </a>
      <button id="admin-logout" class="nav-link-btn ripple-surface" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span data-i18n="nav-logout">登出</span>
      </button>
    </div>
  </nav>

  <main>

    <section id="admin-login" class="admin-stage is-active">
      <div class="modal-card admin-card">
        <h2 data-i18n="login-title">管理员登录</h2>
        <p class="card-sub" data-i18n-html="login-sub">默认账号 / 密码均为 <code>admin</code>，登录后请尽快修改</p>
        <label class="config-row">
          <span class="config-label" data-i18n="cfg-username">用户名</span>
          <input id="admin-user" type="text" autocomplete="username">
        </label>
        <label class="config-row">
          <span class="config-label" data-i18n="cfg-password">密码</span>
          <input id="admin-pass" type="password" autocomplete="current-password">
        </label>
        <p class="card-error" id="admin-login-err" hidden></p>
        <button id="admin-login-submit" class="cta cta-primary ripple-surface card-cta" type="button" data-i18n="btn-login">登录</button>
      </div>
    </section>

    <section id="admin-dashboard" class="admin-stage">

      <div class="admin-tabs">
        <button class="admin-tab ripple-surface is-active" data-tab="stats"      data-i18n="tab-stats">概览</button>
        <button class="admin-tab ripple-surface"            data-tab="parcels"   data-i18n="tab-parcels">所有包裹</button>
        <button class="admin-tab ripple-surface"            data-tab="accounts"  data-i18n="tab-accounts">所有账号</button>
        <button class="admin-tab ripple-surface"            data-tab="config"    data-i18n="tab-config">配置</button>
        <button class="admin-tab ripple-surface"            data-tab="password"  data-i18n="tab-password">修改密码</button>
      </div>

      <div class="admin-panel is-active" data-panel="stats">
        <h2 data-i18n="stats-title">系统概览</h2>
        <div class="stat-grid" id="stat-grid"><span data-i18n="loading">— 加载中 —</span></div>
      </div>

      <div class="admin-panel" data-panel="parcels">
        <h2 data-i18n="parcels-title">所有包裹</h2>
        <p class="card-sub" id="parcels-meta">—</p>
        <div class="admin-table-wrap"><table class="admin-table" id="parcels-table">
          <thead><tr>
            <th data-i18n="th-code">取件码</th>
            <th data-i18n="th-owner">所有者</th>
            <th data-i18n="th-kind">类型</th>
            <th data-i18n="th-size">大小</th>
            <th data-i18n="th-downloads">剩余下载</th>
            <th data-i18n="th-expires">过期时间</th>
            <th data-i18n="th-actions">操作</th>
          </tr></thead>
          <tbody></tbody>
        </table></div>
      </div>

      <div class="admin-panel" data-panel="accounts">
        <h2 data-i18n="accounts-title">所有账号</h2>
        <p class="card-sub" id="accounts-meta">—</p>
        <div class="admin-table-wrap"><table class="admin-table" id="accounts-table">
          <thead><tr>
            <th>ID</th>
            <th data-i18n="th-username">用户名</th>
            <th data-i18n="th-parcels">包裹数</th>
            <th data-i18n="th-storage">占用</th>
            <th data-i18n="th-account-expires">账户到期</th>
            <th data-i18n="th-actions">操作</th>
          </tr></thead>
          <tbody></tbody>
        </table></div>
      </div>

      <div class="admin-panel" data-panel="config">
        <h2 data-i18n="config-title">限额配置</h2>
        <p class="card-sub" data-i18n-html="config-sub">可在线修改，无需重启。<br>单次上传上限受启动时环境变量约束（最高 <span id="hard-ceiling">—</span> GB），可下调不可上调。</p>
        <label class="config-row">
          <span class="config-label" data-i18n="cfg-max-storage">系统总存储 (GB)</span>
          <input id="cfg-max-storage" type="number" min="0.1" step="0.5">
        </label>
        <label class="config-row">
          <span class="config-label" data-i18n="cfg-max-upload">单次上传 (GB)</span>
          <input id="cfg-max-upload" type="number" min="0.1" step="0.5">
        </label>
        <label class="config-row">
          <span class="config-label" data-i18n="cfg-max-expiry">最长有效期（小时）</span>
          <input id="cfg-max-expiry" type="number" min="1" max="672">
        </label>
        <p class="card-error" id="config-err" hidden></p>
        <button id="config-save" class="cta cta-primary ripple-surface card-cta" type="button" data-i18n="btn-save">保存</button>
      </div>

      <div class="admin-panel" data-panel="password">
        <h2 data-i18n="password-title">修改管理员账号</h2>
        <p class="card-sub" data-i18n="password-sub">用户名留空则保持不变；密码必填，新密码即生效</p>
        <label class="config-row">
          <span class="config-label" data-i18n="new-username">新用户名（可选）</span>
          <input id="pw-username" type="text">
        </label>
        <label class="config-row">
          <span class="config-label" data-i18n="current-password">当前密码</span>
          <input id="pw-current" type="password">
        </label>
        <label class="config-row">
          <span class="config-label" data-i18n="new-password">新密码</span>
          <input id="pw-next" type="password">
        </label>
        <p class="card-error" id="pw-err" hidden></p>
        <button id="pw-save" class="cta cta-primary ripple-surface card-cta" type="button" data-i18n="btn-save">保存</button>
      </div>

    </section>
  </main>

  <!-- ─── Admin edit-parcel modal — invoked by the 修改 button in the parcels table ─── -->
  <div id="admin-edit-parcel-modal" class="modal" hidden>
    <div class="modal-backdrop" data-action="admin-edit-parcel-close"></div>
    <div class="modal-card">
      <button class="card-close ripple-surface" type="button" data-action="admin-edit-parcel-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h2 data-i18n="edit-parcel-title">编辑包裹</h2>
      <p class="card-sub" id="admin-edit-parcel-meta">—</p>

      <label class="config-row config-row-with-action">
        <span class="config-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span data-i18n="edit-expiry">有效期 (小时)</span>
        </span>
        <input type="number" id="admin-edit-expiry-hours" min="1" max="876000">
        <button type="button" class="quick-set ripple-surface" id="btn-admin-set-permanent" data-i18n="btn-mark-permanent">设为永久</button>
      </label>
      <label class="config-row config-row-with-action">
        <span class="config-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span data-i18n="edit-downloads">剩余下载次数</span>
        </span>
        <input type="number" id="admin-edit-downloads" min="1" max="999999">
        <button type="button" class="quick-set ripple-surface" id="btn-admin-set-unlimited" data-i18n="btn-mark-unlimited">设为无限</button>
      </label>
      <label class="config-row config-row-with-action">
        <span class="config-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span data-i18n="edit-password">修改密码</span>
        </span>
        <input type="password" id="admin-edit-password" autocomplete="new-password" placeholder="留空保持不变">
        <button type="button" class="quick-set ripple-surface" id="btn-admin-clear-password" data-i18n="btn-clear-password">清除密码</button>
      </label>

      <p class="card-error" id="admin-edit-parcel-err" hidden></p>
      <button id="btn-admin-edit-parcel-save" class="cta cta-primary ripple-surface card-cta" type="button" data-i18n="btn-save">保存</button>
    </div>
  </div>

  <footer><span id="admin-footer">open.drop · admin</span></footer>

  <script src="lib/admin.js"></script>
</body>
</html>
